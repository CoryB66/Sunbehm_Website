<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/assets/logomark.png">
<title>Your Report &middot; Sunbehm Home Watch</title>
<style>
  body{margin:0;background:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#221c10}
  .wrap{max-width:460px;margin:0 auto;padding:56px 20px}
  .card{background:#fff;border:1px solid #e6dfd0;border-radius:12px;padding:34px 28px;text-align:center}
  .logo{width:96px;height:auto;margin:0 auto 18px;display:block}
  .kick{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#a07830;margin:0 0 10px}
  h1{font-size:20px;font-weight:600;margin:0 0 8px}
  p{font-size:14px;color:#7a7060;line-height:1.55;margin:0 0 22px}
  a.btn{display:block;text-decoration:none;font-weight:600;font-size:16px;border-radius:8px;
        padding:16px 20px;background:#c9a052;color:#1a1600}
  .foot{text-align:center;font-size:11px;color:#7a7060;margin-top:18px}
  .foot a{color:#a07830;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img class="logo" src="/assets/logomark.png" alt="Sunbehm Home Watch &amp; Concierge">
    <div class="kick">Sunbehm Home Watch</div>
    <h1>Opening your visit report</h1>
    <p id="msg">One moment&hellip;</p>
    <a class="btn" id="go" href="#">Continue to your report</a>
  </div>
  <p class="foot">Sunbehm Home Watch &amp; Concierge &middot;
     <a href="tel:+12188508629">(218) 850-8629</a></p>
</div>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbwKP9ArWj1pPVUu8Af4VR9JrK2O54drQWKM6Uxg8R85jz8NXJzG6W7EPUR-iHPK6iGSmQ/exec';
  var qs = window.location.search || '';
  if (!qs) {
    document.getElementById('msg').textContent =
      'This link is missing its code. Please open the link from your Sunbehm email, or call us and we will send a new one.';
    document.getElementById('go').style.display = 'none';
    return;
  }
  var url = EXEC + qs;
  document.getElementById('go').href = url;
  window.location.replace(url);   // forwards the full query string untouched
})();
</script>
</body>
</html>
