<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/assets/logomark.png">
<title>Your Report &middot; Sunbehm Home Watch</title>
<style>
  body{margin:0;background:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#221c10}
  .wrap{max-width:460px;margin:0 auto;padding:26px 20px}
  .card{background:#fff;border:1px solid #e6dfd0;border-radius:12px;padding:24px 26px;text-align:center}
  /* Lockup: the brand block shrinks to the width of the kicker line, and the mark is
     left-aligned inside it. At 58px the mark is almost exactly the width of the word
     SUNBEHM, so it sits over that word rather than floating above the whole line. */
  .brand{display:inline-block;text-align:left;margin:0 0 12px}
  .logo{width:58px;height:auto;display:block;margin:0 0 3px 1px}
  .kick{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#a07830;margin:0}
  h1{font-size:20px;font-weight:600;margin:0 0 6px}
  p{font-size:14px;color:#7a7060;line-height:1.5;margin:0 0 18px}
  a.btn{display:block;text-decoration:none;font-weight:600;font-size:16px;border-radius:8px;
        padding:15px 20px;background:#c9a052;color:#1a1600;margin:0 0 9px}
  a.btn2{display:block;text-decoration:none;font-weight:600;font-size:14px;border-radius:8px;
         padding:12px 20px;background:transparent;border:1px solid #c2ad85;color:#a07830}
  .help{font-size:12px;color:#7a7060;margin:16px 0 0;line-height:1.55}
  .help a{color:#a07830;text-decoration:none}
  .foot{text-align:center;font-size:11px;color:#7a7060;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <img class="logo" src="/assets/logomark.png" alt="Sunbehm Home Watch &amp; Concierge">
      <div class="kick">Sunbehm Home Watch</div>
    </div>
    <h1 id="h">Your visit report is ready</h1>
    <p id="msg">Tap below to open your photo report. This link stays active for 30 days &mdash;
       please download a copy if you would like to keep it.</p>
    <div id="btns">
      <a class="btn"  id="view" href="#" target="_top" rel="noopener">Open Your Report</a>
      <a class="btn2" id="dl"   href="#" target="_top" rel="noopener">Download PDF</a>
    </div>
    <p class="help">Trouble opening it? Call or text Sunbehm at
       <a href="tel:+12188508629">(218) 850-8629</a>.</p>
  </div>
  <p class="foot">Sunbehm Home Watch &amp; Concierge</p>
</div>
<script>
(function () {
  // Token format: <driveFileId>.<expiryEpochSeconds>.<signature>
  // The signature is NOT verified here - it cannot be, client-side. Real enforcement is
  // server-side: revokeExpiredReports_() unshares the Drive file every night at 3 AM.
  // The expiry check below is only so an expired link shows a helpful message instead of
  // Google's "request access" screen. Deliberately NO Apps Script hop: script.google.com
  // /exec links 404 for anyone signed into more than one Google account.
  function show(title, message) {
    document.getElementById('h').textContent = title;
    document.getElementById('msg').textContent = message;
    document.getElementById('btns').style.display = 'none';
  }
  var tok = '';
  try { tok = new URLSearchParams(window.location.search).get('r') || ''; } catch (e) {}
  var parts = tok.split('.');
  var fileId = '';
  try { fileId = decodeURIComponent(parts[0] || ''); } catch (e) { fileId = parts[0] || ''; }
  var exp = parseInt(parts[1], 10);

  if (!fileId || !exp || isNaN(exp)) {
    show('We could not open that link',
         'This link is missing its code. Please open it from your Sunbehm email, or call us and we will send a new one.');
    return;
  }
  if (Math.floor(Date.now() / 1000) > exp) {
    show('This report link has expired',
         'For your privacy, report links stay active for 30 days. We keep a permanent copy of every report on file - call or text us and we will send you a fresh link right away.');
    return;
  }
  document.getElementById('view').href = 'https://drive.google.com/file/d/' + fileId + '/view';
  document.getElementById('dl').href   = 'https://drive.google.com/uc?export=download&id=' + fileId;
})();
</script>
</body>
</html>
